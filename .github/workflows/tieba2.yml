name: Start

on:
  workflow_dispatch:  # 加这个，方便你手动点
  push:
    branches: [ master, main ]  # 限制下分支，避免 feature 分支也触发
  schedule:
  - cron: '17 22 * * *'
  - cron: '23 23 * * *'

jobs:
  TiebaSignIn:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 1.8
      uses: actions/setup-java@v5  # 升级到 v5
      with:
        distribution: 'zulu'       # 换用 Azul Zulu 源，避开 temurin 下载异常
        java-version: '8'
        cache: maven

    - name: Build with Maven
      env:
        BDUSS: ${{ secrets.BDUSS }}
        SCKEY: ${{ secrets.SCKEY }}
      run: |
        mvn compile exec:java -Dexec.mainClass="top.srcrs.Run" -Dexec.args="${BDUSS} ${SCKEY}"
